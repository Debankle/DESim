<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="/static/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<script>
    requireAuth();
    document.addEventListener("DOMContentLoaded", async () => {
        const user_tmp = await getMe();
        const user_id = user_tmp["id"];
        const user = await getUser(user_id);
        if (!user) window.location.href = "/login";
        loadProfile(user, true);

        document.getElementById("sort-by").addEventListener("change", () => loadSimulations("user-simulations", { page: 1 }, true));
        document.getElementById("sort-order").addEventListener("change", () => loadSimulations("user-simulations", { page: 1 }, true));
        document.getElementById("filter-status").addEventListener("change", () => loadSimulations("user-simulations", { page: 1 }, true));
    });

    async function setupMFA() {
        const accessToken = localStorage.getItem("access_token");
        if (!accessToken) return alert("No access token found. Please log in again.");
        const idToken = localStorage.getItem("token");
        if (!idToken) return alert("No token found. Please log in again.");

        try {
            const setupRes = await fetch("/v1/users/mfa/setup", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${idToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ access_token: accessToken })
            });
            if (!setupRes.ok) throw new Error("Failed to start MFA setup");
            const setupData = await setupRes.json();

            document.getElementById("mfa-secret").textContent = setupData.secret;
            document.getElementById("mfa-modal").classList.remove("hidden");
        } catch (err) {
            alert("Error setting up MFA: " + err.message);
        }
    }

    async function verifyMFA() {
        const accessToken = localStorage.getItem("access_token");
        if (!accessToken) return alert("No access token found. Please log in again.");
        const idToken = localStorage.getItem("token");
        if (!idToken) return alert("No token found. Please log in again.");

        const code = document.getElementById("mfa-code").value.trim();
        if (!code) return alert("Please enter the code from your authenticator app.");

        try {
            const verifyRes = await fetch("/v1/users/mfa/verify", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${idToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    access_token: accessToken,
                    user_code: code
                })
            });
            const result = await verifyRes.json();
            if (verifyRes.ok) {
                alert("Two-factor authentication enabled successfully!");
                document.getElementById("mfa-modal").classList.add("hidden");
            } else {
                alert("Verification failed: " + (result.detail || "Invalid code."));
            }
        } catch (err) {
            alert("Error verifying MFA: " + err.message);
        }
    }
</script>

<body class="bg-gray-100">
    <nav
        class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-md p-4 flex justify-between items-center text-white">
        <div class="text-2xl font-extrabold tracking-wide cursor-pointer hover:scale-105 transition transform"
            onclick="window.location.href='/'">
            DESim
        </div>
        <div id="menu" class="flex items-center space-x-6 text-lg"></div>
    </nav>

    <main class="p-6">
        <div>
            <div id="user-info" class="mb-6"></div>
        </div>

        <div id="user-actions" class="mb-6">
            <button onclick="setupMFA()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow">
                Enable 2FA
            </button>
        </div>

        <div class="mb-2 flex space-x-2">
            <select id="sort-by" class="p-1 border rounded">
                <option value="">Sort by...</option>
                <option value="simulation_id">UUID</option>
                <option value="equation">Equation</option>
                <option value="theta">Theta</option>
                <option value="status">Status</option>
                <option value="submit_time">Submitted</option>
                <option value="complete_time">Completed</option>
            </select>

            <select id="sort-order" class="p-1 border rounded">
                <option value="asc">Asc</option>
                <option value="desc">Desc</option>
            </select>

            <select id="filter-status" class="p-1 border rounded">
                <option value="">All Status</option>
                <option value="queued">Queued</option>
                <option value="running">Running</option>
                <option value="finished">Finished</option>
                <option value="failed">Failed</option>
            </select>
        </div>

        <div id="user-simulations"></div>
    </main>

    <div id="mfa-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96 text-center">
            <h2 class="text-xl font-semibold mb-2">Set Up Two-Factor Authentication</h2>
            <p class="text-sm text-gray-600 mb-4">Enter this secret key into your authenticator app, then enter the code
                below.</p>
            <p class="font-mono text-lg mb-3" id="mfa-secret">Loading...</p>
            <input id="mfa-code" type="text" placeholder="Enter 6-digit code"
                class="border rounded p-2 w-full text-center mb-3" maxlength="6" />
            <div class="flex justify-between">
                <button onclick="verifyMFA()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Verify</button>
                <button onclick="document.getElementById('mfa-modal').classList.add('hidden')"
                    class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
            </div>
        </div>
    </div>

</body>

</html>
