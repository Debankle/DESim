<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Two-Factor Authentication</h2>
            <form id="mfaForm" class="space-y-4">
                <input type="hidden" id="username" />
                <input type="hidden" id="session" />
                <div>
                    <label for="code" class="block text-sm font-medium text-gray-700">Enter your verification
                        code</label>
                    <input type="text" id="code" name="code" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Verify</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get("username");
            const session = urlParams.get("session");

            document.getElementById("username").value = username;
            document.getElementById("session").value = session;

            const form = document.getElementById("mfaForm");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const code = document.getElementById("code").value;
                mfaChallenge(username, session, code);
            });
        });
    </script>
</body>

</html>
