<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav
        class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-md p-4 flex justify-between items-center text-white">
        <div class="text-2xl font-extrabold tracking-wide cursor-pointer hover:scale-105 transition transform"
            onclick="window.location.href='/'">
            DESim
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Confirm Your Account</h2>

            <form id="confirmForm" class="space-y-4">
                <div>
                    <label for="confirmation_code" class="block text-sm font-medium text-gray-700">Confirmation
                        Code</label>
                    <input type="text" id="confirmation_code" name="confirmation_code" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                    <p class="mt-1 text-sm text-gray-500">Check your email for the verification code.</p>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Confirm</button>
            </form>

            <p class="mt-4 text-center text-sm text-gray-600">
                Didn’t receive an email? Try <a href="/register" class="text-blue-600 hover:underline">registering
                    again</a>.
            </p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const username = params.get("username");
        if (!username) {
            alert("No username provided. Please register again.");
            window.location.href = "/register";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("confirmForm");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const code = formData.get("confirmation_code");

                const res = await fetch("/v1/users/confirm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, confirmation_code: code })
                });

                if (!res.ok) {
                    const msg = await res.text();
                    alert("Confirmation failed: " + msg);
                    return;
                }

                alert("Account confirmed! You can now log in.");
                window.location.href = "/login";
            });
        });
    </script>
</body>

</html>
