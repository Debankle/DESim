<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav
        class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-md p-4 flex justify-between items-center text-white">
        <div class="text-2xl font-extrabold tracking-wide cursor-pointer hover:scale-105 transition transform"
            onclick="window.location.href='/'">
            DESim
        </div>

        <div id="menu" class="flex items-center space-x-6 text-lg"></div>
    </nav>

    <div class="text-center space-y-8 pt-10">
        <h1 class="text-4xl font-bold text-gray-800">
            Differential Equation Simulator
        </h1>
        <div class="flex justify-center gap-6">
            <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-2xl shadow-lg transition"
                onclick="window.location.href='/simulate'">
                Run a Simulation
            </button>
            <button class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-2xl shadow-lg transition"
                onclick="window.location.href='/simulations'">
                Completed Simulations
            </button>
        </div>
    </div>
</body>

</html>
