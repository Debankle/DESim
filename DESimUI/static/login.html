<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav
        class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-md p-4 flex justify-between items-center text-white">
        <div class="text-2xl font-extrabold tracking-wide cursor-pointer hover:scale-105 transition transform"
            onclick="window.location.href='/'">
            DESim
        </div>

        <div id="menu" class="flex items-center space-x-6 text-lg"></div>
    </nav>

    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Login</button>
            </form>

            <div class="my-6 flex items-center">
                <hr class="flex-grow border-gray-300">
                <span class="mx-2 text-gray-500 text-sm">or</span>
                <hr class="flex-grow border-gray-300">
            </div>

            <button onclick="window.location.href='/v1/oauth2/login/google'"
                class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600 transition flex items-center justify-center space-x-2">
                <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5" />
                <span>Login with Google</span>
            </button>

            <p class="mt-4 text-center text-sm text-gray-600">
                Don't have an account?
                <a href="/register" class="text-blue-600 hover:underline">Register</a>
            </p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("loginForm");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                login(formData.get("username"), formData.get("password"));
            });
        });
    </script>
</body>

</html>
