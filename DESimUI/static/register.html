<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Differential Equation Simulator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/scripts.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav
        class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-md p-4 flex justify-between items-center text-white">
        <div class="text-2xl font-extrabold tracking-wide cursor-pointer hover:scale-105 transition transform"
            onclick="window.location.href='/'">
            DESim
        </div>

        <div id="menu" class="flex items-center space-x-6 text-lg"></div>
    </nav>

    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" name="email" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                        class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Register</button>
            </form>

            <p class="mt-4 text-center text-sm text-gray-600">
                Already have an account?
                <a href="/login" class="text-blue-600 hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("registerForm");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                register(
                    formData.get("username"),
                    formData.get("password"),
                    formData.get("email")
                );
            });
        });
    </script>

</body>

</html>
